<style>
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }

            0% { width: 0%; left: 0; }
            50% { width: 70%; left: 15%; }
            100% { width: 0%; left: 100%; }
        }

<!-- Overlay Micro-Interactions Script -->
<script>
        // Simulate a transition after some time (For demo purposes only)
        document.addEventListener('DOMContentLoaded', () => {
            console.log('AbangBus Splash Screen Loaded');
            
            // Interaction: Tap screen to "skip"
            document.body.addEventListener('click', () => {
                const main = document.querySelector('main');
                main.style.transition = 'opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                main.style.opacity = '0';
                main.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    console.log('Transitioning to Home Dashboard...');
                    // In a real app, window.location would change here
                }, 800);
            });
        });
    </script>
